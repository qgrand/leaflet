[package]
name = "qspace-press-api"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
sea-orm = { version = "0.12", features = ["sqlx-postgres", "runtime-tokio-rustls", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonwebtoken = "9"
bcrypt = "0.15"
reqwest = { version = "0.12", features = ["json"] }
redis = { version = "0.25", features = ["tokio-comp"] }
aws-sdk-s3 = "1"
# DEVIATION from the canon doc's `stripe-rust = "0.12.x"`: every published
# version of that crate transitively depends on hmac@0.6.3 -> crypto-mac,
# and every 0.6.x crypto-mac release is yanked from crates.io -- the crate
# is unbuildable today, confirmed via `cargo check`, not assumed. Swapped
# to `async-stripe`, the actively maintained fork of the same API surface
# (same publisher lineage, still called `stripe` in code via its crate
# name). Nothing calls the Stripe API yet (Cycle 3 scope, per
# payments/stripe.rs's own doc comment), so this has zero blast radius
# today -- flagged for whoever implements payments/stripe.rs for real.
async-stripe = { version = "0.41", features = ["runtime-tokio-hyper-rustls"] }
tracing = "0.1"
tracing-subscriber = "0.3"
validator = { version = "0.16", features = ["derive"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }

[[bin]]
name = "qspace-press-api"
path = "src/main.rs"
